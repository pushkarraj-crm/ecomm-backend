upstream d2c_api {
    least_conn;
    server api1:8000 max_fails=3 fail_timeout=10s;
    server api2:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# With a trusted DigitalOcean HTTP load balancer, use its rightmost forwarded
# client address. Restrict the Droplet's port 80 to that load balancer.
map $http_x_forwarded_for $d2c_client_ip {
    default $binary_remote_addr;
    ~*(?:^|,\s*)(?<forwarded_client>[^,\s]+)\s*$ $forwarded_client;
}

limit_req_zone $d2c_client_ip zone=api_per_ip:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 1h;
    }

    location ^~ /media/products/ {
        alias /srv/media/products/;
        access_log off;
        expires 5m;
    }

    location /media/ {
        return 404;
    }

    location / {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://d2c_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
